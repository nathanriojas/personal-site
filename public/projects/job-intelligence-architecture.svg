<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title>Job opportunity intelligence system — sanitized architecture</title>
  <defs>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#eef3f1"/>
    </pattern>
    <marker id="ahg" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 1L10 6L0 11Z" fill="#0e9d73"/>
    </marker>
    <marker id="ahn" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 1L9 5.5L0 10Z" fill="#9aa7ac"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <rect width="1280" height="720" fill="url(#dots)"/>

  <!-- Filtering funnel (subtle, behind the middle stages) -->
  <polygon points="300,196 966,244 966,360 300,408" fill="#f1faf6" stroke="#d5ece1" stroke-width="1.5" stroke-dasharray="4 6"/>
  <text x="312" y="398" font-size="13" fill="#a4afb4" text-anchor="start" letter-spacing="2">FILTERING FUNNEL</text>

  <!-- Header -->
  <text x="31" y="50" font-size="17" fill="#0e9d73" letter-spacing="2" font-weight="600">JOB OPPORTUNITY INTELLIGENCE</text>
  <text x="31" y="74" font-size="14" fill="#8b979d" letter-spacing="2">SANITIZED ARCHITECTURE</text>

  <!-- Discovery sources -->
  <text x="235" y="90" font-size="13" fill="#8b979d" text-anchor="middle" letter-spacing="2">DISCOVERY SOURCES</text>
  <g stroke="#9aa7ac" stroke-width="1.6" fill="none">
    <line x1="130" y1="163" x2="176" y2="246" marker-end="url(#ahn)"/>
    <line x1="340" y1="163" x2="208" y2="246" marker-end="url(#ahn)"/>
  </g>
  <g font-size="15" fill="#55636b" text-anchor="middle">
    <rect x="45"  y="110" width="170" height="52" rx="10" fill="#fbfdfc" stroke="#dde5e2" stroke-width="1.6"/>
    <text x="130" y="131"><tspan x="130">Structured</tspan><tspan x="130" dy="18">employer feeds</tspan></text>
    <rect x="255" y="110" width="170" height="52" rx="10" fill="#fbfdfc" stroke="#dde5e2" stroke-width="1.6"/>
    <text x="340" y="131"><tspan x="340">Broad search</tspan><tspan x="340" dy="18">providers</tspan></text>
  </g>

  <!-- Primary pipeline arrows -->
  <g stroke="#0e9d73" stroke-width="3" fill="none">
    <line x1="282" y1="302" x2="326" y2="302" marker-end="url(#ahg)"/>
    <line x1="506" y1="302" x2="550" y2="302" marker-end="url(#ahg)"/>
    <line x1="730" y1="302" x2="774" y2="302" marker-end="url(#ahg)"/>
    <line x1="954" y1="302" x2="998" y2="302" marker-end="url(#ahg)"/>
  </g>

  <!-- Stage numbers -->
  <g font-size="13" fill="#a4afb4" text-anchor="middle" letter-spacing="1.5">
    <text x="192"  y="238">01</text>
    <text x="416"  y="238">02</text>
    <text x="640"  y="238">03</text>
    <text x="864"  y="238">04</text>
    <text x="1088" y="238">05</text>
  </g>

  <!-- Primary stage boxes -->
  <g fill="#1f2a37" text-anchor="middle" font-weight="600" font-size="19">
    <rect x="104"  y="250" width="176" height="104" rx="14" fill="#f4f7f6" stroke="#cdd8d3" stroke-width="2"/>
    <text x="192"  y="294"><tspan x="192">Source</tspan><tspan x="192" dy="28">ingestion</tspan></text>

    <rect x="328"  y="250" width="176" height="104" rx="14" fill="#f4f7f6" stroke="#cdd8d3" stroke-width="2"/>
    <text x="416"  y="294"><tspan x="416">Normalize &amp;</tspan><tspan x="416" dy="28">deduplicate</tspan></text>

    <rect x="552"  y="250" width="176" height="104" rx="14" fill="#eef8f3" stroke="#0e9d73" stroke-width="2.5"/>
    <text x="640"  y="294"><tspan x="640">Policy</tspan><tspan x="640" dy="28">evaluation</tspan></text>

    <rect x="776"  y="250" width="176" height="104" rx="14" fill="#f4f7f6" stroke="#cdd8d3" stroke-width="2"/>
    <text x="864"  y="294"><tspan x="864">Fit</tspan><tspan x="864" dy="28">classification</tspan></text>

    <rect x="1000" y="250" width="176" height="104" rx="14" fill="#f4f7f6" stroke="#cdd8d3" stroke-width="2"/>
    <text x="1088" y="310" font-size="20">Alerts</text>
  </g>

  <!-- Parallel diagnostic / explainability branch -->
  <line x1="640" y1="356" x2="640" y2="468" stroke="#0e9d73" stroke-width="3" marker-end="url(#ahg)"/>
  <text x="640" y="456" font-size="13" fill="#0e9d73" text-anchor="middle" letter-spacing="1.5">PARALLEL OUTPUT · EXPLAINABILITY</text>
  <rect x="480" y="470" width="320" height="96" rx="14" fill="#f4fbf8" stroke="#0e9d73" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="640" y="510" font-size="19" fill="#1f2a37" font-weight="600" text-anchor="middle"><tspan x="640">Rejection reasons</tspan><tspan x="640" dy="28">&amp; run diagnostics</tspan></text>

  <!-- Caption -->
  <text x="31" y="684" font-size="14" fill="#8b979d">Postings are scored against configurable criteria; explicit accept and reject reasons are retained for tuning.</text>
</svg>
